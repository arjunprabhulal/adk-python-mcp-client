manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: arjunprabhulal/adk-python-mcp-client
    source: https://github.com/arjunprabhulal/adk-python-mcp-client
    branch: main
    commit: "a77a2345"
    scope: [client.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:33:59Z'
    url: https://a2as.org/certified/agents/arjunprabhulal/adk-python-mcp-client
  signatures:
    digest: sha256:2J8s2Ps-EB6ORokRPzyshU2kX5F-uLaekKCJO_Lgt4M
    key: ed25519:kr2WKT0GBwPleexOxpHxPD-X1CIquGjhhPqoFJ9piLI
    sig: ed25519:VNHyohraz60BO3gCREi7Edu8jLpj4cn1UGrXIya2YH4qmnqLzRUtkBEOz-efihx021EyYEfz1Fa4JnD0lqXfCQ

agents:
  root_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [toolset]
    mcp: [toolset]
    params:
      name: flight_search_assistant
      instruction: ['Help user to search for flights using available tools based on prompt. If return date not specified,
          use an empty string for one-way trips.']
      function: get_agent_async

models:
  gemini-2.0-flash:
    type: literal
    agents: [root_agent]

tools:
  toolset:
    type: mcp
    agents: [root_agent]
    params:
      class: MCPToolset
      mcp_server: toolset

mcp:
  toolset:
    type: process
    agents: [root_agent]
    params:
      class: MCPToolset
      connection_type: StdioServerParameters
      command: mcp-flight-search
      args: [--connection_type, stdio]
      env:
        SERP_API_KEY: SERP_API_KEY

imports:
  asyncio: asyncio
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  json: json
  LlmAgent: google.adk.agents.llm_agent.LlmAgent
  load_dotenv: dotenv.load_dotenv
  logging: logging
  MCPToolset: google.adk.tools.mcp_tool.mcp_toolset.MCPToolset
  os: os
  Runner: google.adk.runners.Runner
  StdioServerParameters: google.adk.tools.mcp_tool.mcp_toolset.StdioServerParameters
  types: google.genai.types

functions:
  async_main:
    type: async
    module: client
  get_agent_async:
    type: async
    module: client

variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [client]
  SERP_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [client]

processes:
  mcp-flight-search:
    type: mcp
    actions: [exec]
    args: [[--connection_type, stdio]]
    params:
      caller: [StdioServerParameters]
      shell: ["False"]
